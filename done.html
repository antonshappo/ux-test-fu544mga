<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задание завершено</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/ds.css">
<style>
/* Финал задания теста (Useberry). Под затемнением — корзина участника в том виде, в каком он нажал
   «Перейти к оформлению» (прототип в режиме frozen). Карточка — по мотивам 🖥️ Modal S: 480, r16, отступы 40. */
html, body { margin: 0; height: 100%; overflow: hidden; background: #F5F4F1; font-family: var(--f-base); color: var(--text-primary); }
.fin-bg { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.fin-ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(33, 40, 43, .6); animation: fin-fade .25s ease-out both; }
.fin-card { width: 480px; max-width: 100%; box-sizing: border-box; padding: 40px; border-radius: 16px; background: var(--background-primary);
  box-shadow: var(--box-shadow-l); display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center;
  animation: fin-up .35s cubic-bezier(.2,.8,.2,1) .05s both; }
.fin-ico { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.fin-ico svg { width: 36px; height: 36px; }
.fin-ico--ok { background: var(--success-primary, #009F57); animation: fin-pop .45s cubic-bezier(.3,1.6,.5,1) .2s both; }
.fin-ico--ok path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: fin-draw .35s ease-out .5s forwards; }
.fin-ico--done { background: var(--control-minor); }
.fin-txt { display: flex; flex-direction: column; gap: 8px; }
.fin-t { margin: 0; font-size: 27px; line-height: 32px; font-weight: 600; letter-spacing: .25px; }
.fin-p { margin: 0; font-size: 17px; line-height: 24px; letter-spacing: .2px; color: var(--text-secondary); }
@keyframes fin-fade { from { opacity: 0; } }
@keyframes fin-up { from { opacity: 0; transform: translateY(12px) scale(.98); } }
@keyframes fin-pop { from { transform: scale(.4); opacity: 0; } }
@keyframes fin-draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .fin-ico--ok path { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<iframe class="fin-bg" id="bg" title="Корзина" tabindex="-1" aria-hidden="true"></iframe>
<div class="fin-ov">
  <div class="fin-card" role="status">
    <div class="fin-ico fin-ico--done"><svg viewBox="0 0 24 24" fill="none"><path d="M3.75 12H20.25M13.5 5.25L20.25 12L13.5 18.75" stroke="#21282B" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="fin-txt"><p class="fin-t">Задание завершено</p><p class="fin-p">Спасибо! Можно переходить к следующему заданию</p></div>
  </div>
</div>
<script>
  // Корзина участника под затемнением: задание и состав берём из адреса
  const P = new URLSearchParams(location.search);
  document.getElementById('bg').src = 'prototype.html?frozen=1&task=' + encodeURIComponent(P.get('task') || '') + '&cart=' + encodeURIComponent(P.get('cart') || '');
</script>
</body>
</html>
